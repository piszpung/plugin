name: Build plugins (Windows + macOS)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        plugin: [Polymer, Spore, Poltergeist, Ember, Residue]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch JUCE 8.0.12
        run: git clone --depth 1 --branch 8.0.12 https://github.com/juce-framework/JUCE.git ${{ matrix.plugin }}/JUCE
      - name: Configure
        run: cmake -S ${{ matrix.plugin }} -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}-VST3-Windows
          path: build/${{ matrix.plugin }}_artefacts/Release/VST3/${{ matrix.plugin }}.vst3

      # macOS: ad-hoc signature (enough to run on your own Mac; for selling you need a Developer ID signature + notarization)
      - name: Sign ad-hoc (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep -s - "build/${{ matrix.plugin }}_artefacts/Release/VST3/${{ matrix.plugin }}.vst3"
          codesign --force --deep -s - "build/${{ matrix.plugin }}_artefacts/Release/AU/${{ matrix.plugin }}.component"
      - name: Upload (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}-macOS
          path: |
            build/${{ matrix.plugin }}_artefacts/Release/VST3/${{ matrix.plugin }}.vst3
            build/${{ matrix.plugin }}_artefacts/Release/AU/${{ matrix.plugin }}.component
